<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" dir="rtl" font-family="Segoe UI, IRANSans, Tahoma, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="plan61Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="plan71Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="goalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="780" fill="url(#bg)"/>

  <!-- ===== ROOT ===== -->
  <rect x="300" y="20" width="360" height="50" rx="14" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="480" y="52" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">گزارش کار کامپوننت‌ها — ۹/۱/۲۶</text>

  <!-- Root to 3 branches -->
  <path d="M 480 70 L 480 90 L 160 90 L 160 110" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 70 L 480 110" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 70 L 480 90 L 800 90 L 800 110" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ===== PLAN 6.1 BRANCH ===== -->
  <rect x="60" y="110" width="200" height="42" rx="12" fill="url(#plan61Grad)" filter="url(#shadow)"/>
  <text x="160" y="137" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">پلن ۶.۱ — انتقال به Core</text>

  <line x1="160" y1="152" x2="160" y2="470" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

  <g font-size="11" font-weight="600">
    <path d="M 160 170 L 120 170 L 120 180" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="180" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="201" text-anchor="middle" fill="#15803d">✅ ۶ فایل Type به Core</text>

    <path d="M 160 222 L 120 222 L 120 232" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="232" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="253" text-anchor="middle" fill="#15803d">✅ ComponentManager به Core</text>

    <path d="M 160 274 L 120 274 L 120 284" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="284" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="305" text-anchor="middle" fill="#15803d">✅ ۷ فایل import به‌روز</text>

    <path d="M 160 326 L 120 326 L 120 336" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="336" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="357" text-anchor="middle" fill="#15803d">✅ Backward Compatibility</text>

    <path d="M 160 378 L 120 378 L 120 388" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="388" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="409" text-anchor="middle" fill="#15803d">✅ UI → Core وابستگی کمتر</text>

    <path d="M 160 430 L 120 430 L 120 440" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="440" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="461" text-anchor="middle" fill="#15803d">✅ ۷۸۸ خطا (۱ کمتر)</text>
  </g>

  <!-- ===== PLAN 7.1 BRANCH ===== -->
  <rect x="380" y="110" width="200" height="42" rx="12" fill="url(#plan71Grad)" filter="url(#shadow)"/>
  <text x="480" y="137" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">پلن ۷.۱ — Category System</text>

  <line x1="480" y1="152" x2="480" y2="470" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>

  <g font-size="11" font-weight="600">
    <path d="M 480 180 L 440 180 L 440 190" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="190" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="211" text-anchor="middle" fill="#15803d">✅ Totality + identity</text>

    <path d="M 480 232 L 440 232 L 440 242" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="242" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="263" text-anchor="middle" fill="#15803d">✅ CreateCategoryComponent</text>

    <path d="M 480 284 L 440 284 L 440 294" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="294" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="315" text-anchor="middle" fill="#15803d">✅ حذف as any هک</text>

    <path d="M 480 336 L 440 336 L 440 346" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="346" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="367" text-anchor="middle" fill="#15803d">✅ ۴ Category آماده</text>

    <path d="M 480 388 L 440 388 L 440 398" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="398" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="419" text-anchor="middle" fill="#15803d">✅ الگوی Icon = Component</text>

    <path d="M 480 440 L 440 440 L 440 450" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="450" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="471" text-anchor="middle" fill="#15803d">✅ ۷۸۸ خطا (بدون تغییر)</text>
  </g>

  <!-- ===== DOC & UPDATES BRANCH ===== -->
  <rect x="700" y="110" width="200" height="42" rx="12" fill="url(#docGrad)" filter="url(#shadow)"/>
  <text x="800" y="137" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">مستند و به‌روزرسانی</text>

  <line x1="800" y1="152" x2="800" y2="520" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>

  <g font-size="11" font-weight="600">
    <path d="M 800 180 L 840 180 L 840 190" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="190" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="211" text-anchor="middle" fill="#15803d">✅ component() → create()</text>

    <path d="M 800 232 L 840 232 L 840 242" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="242" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="263" text-anchor="middle" fill="#15803d">✅ Types از Core در مستند</text>

    <path d="M 800 284 L 840 284 L 840 294" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="294" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="315" text-anchor="middle" fill="#15803d">✅ بخش Category جدید</text>

    <path d="M 800 336 L 840 336 L 840 346" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="346" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="367" text-anchor="middle" fill="#15803d">✅ بخش Static Factory</text>

    <path d="M 800 388 L 840 388 L 840 398" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="398" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="419" text-anchor="middle" fill="#15803d">✅ Anti-Patterns جدید</text>

    <path d="M 800 440 L 840 440 L 840 450" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="450" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="471" text-anchor="middle" fill="#15803d">✅ چک‌لیست ۷ مرحله‌ای</text>

    <path d="M 800 492 L 840 492 L 840 502" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="502" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="523" text-anchor="middle" fill="#15803d">✅ Source References</text>
  </g>

  <!-- ===== GOAL BOX ===== -->
  <rect x="240" y="580" width="480" height="120" rx="16" fill="url(#goalGrad)" filter="url(#shadow)"/>
  <text x="480" y="612" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">🎯 هدف بعدی: ساخت ComponentMessages</text>
  <text x="480" y="638" text-anchor="middle" fill="#bfdbfe" font-size="12">معماری آماده ✅ → نیاز: اولین Component واقعی برای تست معماری</text>
  <text x="480" y="660" text-anchor="middle" fill="#dbeafe" font-size="11">Messages — با Step + Props + Schemas + Methods</text>
  <text x="480" y="682" text-anchor="middle" fill="#dbeafe" font-size="11">ثبت در ComponentManager + Category → استفاده در ClTestsPage</text>

  <!-- ===== LEGEND ===== -->
  <g font-size="10" fill="#6b7280">
    <rect x="40" y="740" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="60" y="751">تکمیل‌شده</text>
    <rect x="140" y="740" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="160" y="751">در حال توسعه</text>
    <rect x="250" y="740" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="270" y="751">مراحل اولیه</text>
  </g>
</svg>
