    <rect x="200" y="232" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="290" y="253" text-anchor="middle" fill="#15803d">✅ ComponentStructureBase (abstract)</text>

    <path d="M 290 274 L 250 274 L 250 284" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="200" y="284" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="290" y="305" text-anchor="middle" fill="#15803d">✅ Base/Concrete Split الگو</text>

    <path d="M 290 326 L 250 326 L 250 336" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="200" y="336" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="290" y="357" text-anchor="middle" fill="#15803d">✅ ۳ Example: Default/Content/Hidden</text>

    <!-- ComponentIcon -->
    <path d="M 290 378 L 250 378 L 250 388" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="200" y="388" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="290" y="409" text-anchor="middle" fill="#15803d">✅ ComponentIcon ایجاد</text>

    <path d="M 290 430 L 250 430 L 250 440" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="200" y="440" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="290" y="461" text-anchor="middle" fill="#15803d">✅ ComponentIconBase (abstract)</text>

