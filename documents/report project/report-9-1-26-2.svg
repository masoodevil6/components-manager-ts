    <rect x="10" y="440" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="100" y="461" text-anchor="middle" fill="#15803d">✅ TestsPage کشف خودکار</text>
  </g>

