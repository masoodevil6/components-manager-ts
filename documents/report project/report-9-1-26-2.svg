      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="plan815Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="callbackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="eventGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="goalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="980" fill="url(#bg)"/>

  <!-- ===== ROOT ===== -->
  <rect x="280" y="20" width="400" height="50" rx="14" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="480" y="52" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">گزارش کار کامپوننت‌ها — ۹/۱/۲۶ (گزارش دوم)</text>

  <!-- Root to 5 branches -->
  <path d="M 480 70 L 480 90 L 100 90 L 100 110" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 70 L 480 90 L 290 90 L 290 110" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 70 L 480 90 L 480 110" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 70 L 480 90 L 670 90 L 670 110" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 70 L 480 90 L 860 90 L 860 110" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>

