    <rect x="810" y="190" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="900" y="211" text-anchor="middle" fill="#15803d">✅ Guide به‌روزرسانی ۸.۱.۵</text>

