  <text x="290" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ساخت کامپوننت‌ها</text>

  <line x1="290" y1="152" x2="290" y2="600" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>

  <g font-size="11" font-weight="600">
