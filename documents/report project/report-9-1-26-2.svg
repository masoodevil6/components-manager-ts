    <rect x="200" y="180" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="290" y="201" text-anchor="middle" fill="#15803d">✅ ComponentStructure ایجاد</text>

