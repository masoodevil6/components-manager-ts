    <rect x="390" y="242" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="480" y="263" text-anchor="middle" fill="#15803d">✅ MethodsConfigType&lt;TThis&gt;</text>

    <path d="M 480 284 L 440 284 L 440 294" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="390" y="294" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="480" y="315" text-anchor="middle" fill="#15803d">✅ this: TThis (function نه arrow)</text>

    <path d="M 480 336 L 440 336 L 440 346" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="390" y="346" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
