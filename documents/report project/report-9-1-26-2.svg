  <rect x="20" y="110" width="160" height="42" rx="12" fill="url(#plan815Grad)" filter="url(#shadow)"/>
  <text x="100" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">پلن ۸.۱.۵ — Example System</text>

