    <path d="M 480 388 L 440 388 L 440 398" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="390" y="398" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="480" y="419" text-anchor="middle" fill="#15803d">✅ executeMethod routing</text>

    <path d="M 480 440 L 440 440 L 440 450" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="390" y="450" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="480" y="471" text-anchor="middle" fill="#15803d">✅ Clickable Example با CLICK واقعی</text>
  </g>

  <!-- ===== COREEVENT BRANCH ===== -->
  <rect x="590" y="110" width="160" height="42" rx="12" fill="url(#eventGrad)" filter="url(#shadow)"/>
  <text x="670" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">CoreEvent در کامپوننت</text>

