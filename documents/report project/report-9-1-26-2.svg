    <rect x="810" y="242" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="900" y="263" text-anchor="middle" fill="#15803d">✅ الگوی Example با render()</text>

    <path d="M 860 284 L 900 284 L 900 294" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="810" y="294" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="900" y="315" text-anchor="middle" fill="#15803d">✅ Base/Concrete Split مستند</text>

    <path d="M 860 336 L 900 336 L 900 346" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="810" y="346" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="900" y="367" text-anchor="middle" fill="#15803d">✅ TestsPage Section جدید</text>

    <path d="M 860 388 L 900 388 L 900 398" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="810" y="398" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="900" y="419" text-anchor="middle" fill="#15803d">✅ Anti-Patterns جدید</text>

    <path d="M 860 440 L 900 440 L 900 450" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="810" y="450" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="900" y="471" text-anchor="middle" fill="#15803d">✅ چک‌لیست به‌روزرسانی</text>
  </g>

  <!-- ===== STATS BOX ===== -->
  <rect x="40" y="660" width="880" height="80" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="480" y="688" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">📊 آمار کلی</text>
  <text x="160" y="715" text-anchor="middle" fill="#374151" font-size="12" font-weight="600">۲ کامپوننت ایجاد شد</text>
  <text x="380" y="715" text-anchor="middle" fill="#374151" font-size="12" font-weight="600">۵ Example ایجاد شد</text>
  <text x="600" y="715" text-anchor="middle" fill="#374151" font-size="12" font-weight="600">۲ Base کلاس ایجاد شد</text>
  <text x="800" y="715" text-anchor="middle" fill="#374151" font-size="12" font-weight="600">Vite Build ✅</text>

  <!-- ===== GOAL BOX ===== -->
  <rect x="120" y="770" width="720" height="140" rx="16" fill="url(#goalGrad)" filter="url(#shadow)"/>
  <text x="480" y="802" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">🎯 هدف‌های بعدی</text>
  <text x="480" y="830" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="600">۱. ساخت ComponentMessages</text>
  <text x="480" y="852" text-anchor="middle" fill="#dbeafe" font-size="11">پیام‌های سیستمی (success/error/warning/info) با Step + Props + Schemas + Methods</text>
  <text x="480" y="876" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="600">۲. ساخت ComponentButton</text>
  <text x="480" y="898" text-anchor="middle" fill="#dbeafe" font-size="11">دکمه با CLICK/HOVER/BLUR + آیکون + type (button/submit/reset)</text>

  <!-- ===== LEGEND ===== -->
  <g font-size="10" fill="#6b7280">
    <rect x="40" y="940" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="60" y="951">تکمیل‌شده</text>
    <rect x="140" y="940" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="160" y="951">در حال توسعه</text>
    <rect x="250" y="940" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
