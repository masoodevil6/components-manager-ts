    <rect x="620" y="242" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="710" y="263" text-anchor="middle" fill="#15803d">✅ _COMPONENT_STEP field</text>

    <path d="M 670 284 L 710 284 L 710 294" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="620" y="294" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="710" y="315" text-anchor="middle" fill="#15803d">✅ Identity (unique/emit/events)</text>

    <path d="M 670 336 L 710 336 L 710 346" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="620" y="346" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="710" y="367" text-anchor="middle" fill="#15803d">✅ TestsPage با تست واقعی</text>

    <path d="M 670 388 L 710 388 L 710 398" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="620" y="398" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="710" y="419" text-anchor="middle" fill="#15803d">✅ Constructor با step param</text>

    <path d="M 670 440 L 710 440 L 710 450" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="620" y="450" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="710" y="471" text-anchor="middle" fill="#15803d">✅ emit با function (auto-bind this)</text>
  </g>

  <!-- ===== DOCS BRANCH ===== -->
