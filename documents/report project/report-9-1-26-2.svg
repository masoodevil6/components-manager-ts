    <text x="100" y="201" text-anchor="middle" fill="#15803d">✅ ComponentExample با render()</text>

    <path d="M 100 222 L 60 222 L 60 232" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="10" y="232" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="100" y="253" text-anchor="middle" fill="#15803d">✅ حذف ExampleRenderer</text>

    <path d="M 100 274 L 60 274 L 60 284" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="10" y="284" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="100" y="305" text-anchor="middle" fill="#15803d">✅ ComponentManager به‌روز</text>

    <path d="M 100 326 L 60 326 L 60 336" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="10" y="336" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="100" y="357" text-anchor="middle" fill="#15803d">✅ حذف componentStructure/examples</text>

    <path d="M 100 378 L 60 378 L 60 388" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="10" y="388" width="180" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="100" y="409" text-anchor="middle" fill="#15803d">✅ بازنویسی Exampleهای Icon</text>

