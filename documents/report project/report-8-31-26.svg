<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" dir="rtl" font-family="Segoe UI, IRANSans, Tahoma, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="utilGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="goalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="780" fill="url(#bg)"/>

  <!-- ===== ROOT ===== -->
  <rect x="360" y="20" width="240" height="50" rx="14" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="480" y="52" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Components Master</text>

  <!-- Root to 3 branches -->
  <path d="M 480 70 L 480 90 L 160 90 L 160 110" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 70 L 480 110" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 70 L 480 90 L 800 90 L 800 110" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ===== CORE BRANCH ===== -->
  <rect x="60" y="110" width="200" height="42" rx="12" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="160" y="137" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Core — هسته</text>

  <line x1="160" y1="152" x2="160" y2="520" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

  <g font-size="11" font-weight="600">
    <path d="M 160 170 L 120 170 L 120 180" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="180" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="201" text-anchor="middle" fill="#15803d">✅ Observable</text>

    <path d="M 160 222 L 120 222 L 120 232" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="232" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="253" text-anchor="middle" fill="#15803d">✅ Reactive</text>

    <path d="M 160 274 L 120 274 L 120 284" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="284" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="305" text-anchor="middle" fill="#15803d">✅ Languages</text>

    <path d="M 160 326 L 120 326 L 120 336" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="336" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="357" text-anchor="middle" fill="#15803d">✅ Route</text>

    <path d="M 160 378 L 120 378 L 120 388" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="388" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="409" text-anchor="middle" fill="#15803d">✅ Configs</text>

    <path d="M 160 430 L 120 430 L 120 440" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="440" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="120" y="461" text-anchor="middle" fill="#15803d">✅ Event</text>

    <path d="M 160 482 L 120 482 L 120 492" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="492" width="160" height="32" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#softShadow)"/>
    <text x="120" y="513" text-anchor="middle" fill="#b91c1c">🔴 Components</text>

    <!-- Goal connector from Components -->
    <path d="M 200 508 L 340 508 L 340 660 L 360 660" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round"/>
  </g>

  <!-- ===== UI BRANCH ===== -->
  <rect x="380" y="110" width="200" height="42" rx="12" fill="url(#uiGrad)" filter="url(#shadow)"/>
  <text x="480" y="137" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">UI — رابط کاربری</text>

  <line x1="480" y1="152" x2="480" y2="380" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>

  <g font-size="11" font-weight="600">
    <path d="M 480 180 L 440 180 L 440 190" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="190" width="160" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="211" text-anchor="middle" fill="#15803d">✅ Icons — ۱۲۰+</text>

    <path d="M 480 232 L 440 232 L 440 242" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="242" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="263" text-anchor="middle" fill="#b45309">🔄 Categories</text>

    <path d="M 480 284 L 440 284 L 440 294" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="294" width="160" height="32" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#softShadow)"/>
    <text x="440" y="315" text-anchor="middle" fill="#b91c1c">🔴 Components</text>

    <path d="M 480 336 L 440 336 L 440 346" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <rect x="360" y="346" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="440" y="367" text-anchor="middle" fill="#b45309">🔄 Pages</text>
  </g>

  <!-- ===== UTIL BRANCH ===== -->
  <rect x="700" y="110" width="200" height="42" rx="12" fill="url(#utilGrad)" filter="url(#shadow)"/>
  <text x="800" y="137" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Util — ابزارها</text>

  <line x1="800" y1="152" x2="800" y2="620" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>

  <g font-size="11" font-weight="600">
    <path d="M 800 170 L 840 170 L 840 180" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="180" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="201" text-anchor="middle" fill="#b45309">✅ Brands</text>

    <path d="M 800 222 L 840 222 L 840 232" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="232" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="253" text-anchor="middle" fill="#b45309">✅ Validators</text>

    <path d="M 800 274 L 840 274 L 840 284" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="284" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="305" text-anchor="middle" fill="#b45309">✅ Dates</text>

    <path d="M 800 326 L 840 326 L 840 336" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="336" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="357" text-anchor="middle" fill="#b45309">✅ Files</text>

    <path d="M 800 378 L 840 378 L 840 388" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="388" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="409" text-anchor="middle" fill="#b45309">✅ Styles</text>

    <path d="M 800 430 L 840 430 L 840 440" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="440" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="461" text-anchor="middle" fill="#b45309">✅ Convertor</text>

    <path d="M 800 482 L 840 482 L 840 492" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="492" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="513" text-anchor="middle" fill="#b45309">✅ Consts</text>

    <path d="M 800 534 L 840 534 L 840 544" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="544" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="565" text-anchor="middle" fill="#b45309">✅ Tools</text>

    <path d="M 800 586 L 840 586 L 840 596" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="760" y="596" width="160" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" filter="url(#softShadow)"/>
    <text x="840" y="617" text-anchor="middle" fill="#b45309">✅ Excel</text>
  </g>

  <!-- ===== GOAL BOX ===== -->
  <rect x="360" y="640" width="400" height="110" rx="16" fill="url(#goalGrad)" filter="url(#shadow)"/>
  <text x="560" y="670" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">🎯 هدف آینده: توسعه ماژول کامپوننت</text>
  <text x="560" y="694" text-anchor="middle" fill="#bfdbfe" font-size="12">کلاس پایه آماده ✅ → نیاز: Button · TextInput · Table · Modal · Tab · Menu</text>
  <text x="560" y="716" text-anchor="middle" fill="#dbeafe" font-size="11">بدون کامپوننت‌های آماده، ساخت صفحات کند و تکراری است</text>

  <!-- ===== LEGEND ===== -->
  <g font-size="10" fill="#6b7280">
    <rect x="40" y="740" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="60" y="751">تکمیل‌شده</text>
    <rect x="140" y="740" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="160" y="751">در حال توسعه</text>
    <rect x="250" y="740" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="270" y="751">مراحل اولیه</text>
  </g>
</svg>
